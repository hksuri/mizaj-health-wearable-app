[project]
name = "mizaj"
version = "0.1.0"
description = "Mizaj FastAPI agent and tools"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sse-starlette>=2.1",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "duckdb>=1.1",
  "pyarrow>=18.0",
  "polars>=1.14",
  "structlog>=24.4",
  "anthropic>=0.40",
  "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mizaj"]
