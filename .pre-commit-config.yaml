repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: block-data-dir
        name: block personal data/ files
        entry: bash -c 'git diff --cached --name-only | grep -E "^data/.*\\.(parquet|duckdb|json)$" && echo "Do not commit files under data/" && exit 1 || exit 0'
        language: system
        pass_filenames: false
