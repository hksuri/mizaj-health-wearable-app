[project]
name = "mizaj-ingest"
version = "0.1.0"
description = "Mizaj Google Health ingest CLI"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.14",
  "httpx>=0.28",
  "google-auth>=2.36",
  "google-auth-oauthlib>=1.2",
  "keyring>=25.5",
  "pydantic>=2.9",
  "duckdb>=1.1",
  "pyarrow>=18.0",
  "polars>=1.14",
  "structlog>=24.4",
]

[project.scripts]
ingest = "ingest.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]
