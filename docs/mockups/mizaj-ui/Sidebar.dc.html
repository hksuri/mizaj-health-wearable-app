<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mizaj — sidebar</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Primary" style="width: 100%; height: 100%; min-height: {{minH}}; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; padding: 14px 12px; border-radius: 18px; background: {{t.glass}}; backdrop-filter: blur(24px) saturate(140%); border: 1px solid {{t.hair}}; box-shadow: {{t.shadow}}; font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 13px; line-height: 1.45; color: {{t.text}}">
  <div style="display: flex; align-items: center; gap: 10px; padding: 2px 4px">
    <div style="width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: {{t.accentSoft}}; color: {{t.accent}}">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round"><rect x="6.5" y="6.5" width="11" height="11"></rect><rect x="6.5" y="6.5" width="11" height="11" transform="rotate(45 12 12)"></rect></svg>
    </div>
    <div style="display: flex; align-items: baseline; gap: 6px"><span style="font-weight: 600; font-size: 15px; letter-spacing: -0.01em">Mizaj</span><span lang="ar" style="font-size: 13px; color: {{t.faint}}">مزاج</span></div>
    <span style="margin-left: auto; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: {{t.faint}}; padding: 2px 6px; border-radius: 6px; background: {{t.chip}}">local</span>
  </div>

  <a href="ChatEmpty.dc.html" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 11px; border: 1px solid {{t.hair}}; background: {{t.glass2}}; color: {{t.text}}; font-weight: 500; text-decoration: none; box-shadow: {{t.shadow}}">
    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round"><path d="M12 5v14M5 12h14"></path></svg>
    New chat
    <span style="margin-left: auto; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: {{t.faint}}">⌘N</span>
  </a>

  <label style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border-radius: 10px; background: {{t.input}}; border: 1px solid {{t.hair}}; color: {{t.faint}}">
    <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" style="flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4-4"></path></svg>
    <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Search chats</span>
    <input type="search" placeholder="Search chats" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: {{t.text}}; font: inherit">
    <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px">⌘K</span>
  </label>

  <div style="display: flex; flex-direction: column; gap: 2px">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="3">
      <a href="{{n.href}}" aria-current="{{n.current}}" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 9px; background: {{n.bg}}; color: {{n.fg}}; text-decoration: none; font-weight: 500">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" style="flex: none; fill: none; stroke: {{n.ic}}; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round"><path d="{{n.icon}}"></path></svg>
        {{n.label}}
        <span style="margin-left: auto; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; font-weight: 400; color: {{t.faint}}">{{n.count}}</span>
      </a>
    </sc-for>
  </div>

  <div style="height: 1px; background: {{t.hair}}; margin: 0 4px"></div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 14px; min-height: 0">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 1px">
        <div style="padding: 0 10px 4px; font-size: 11.5px; font-weight: 500; color: {{t.faint}}">{{g.label}}</div>
        <sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
          <a href="Main.dc.html" style="display: block; padding: 7px 10px; border-radius: 8px; background: {{it.bg}}; color: {{it.fg}}; font-weight: {{it.weight}}; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.title}}</a>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 12px; background: {{t.chip}}; border: 1px solid {{t.hair}}">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: {{t.ok}}"></span>
      Google Health · synced 6:12 AM
    </div>
    <div style="font-size: 11.5px; color: {{t.faint}}">18 months · steps, active min, resting HR, sleep</div>
    <div style="display: flex; gap: 6px; flex-wrap: wrap">
      <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; padding: 2px 6px; border-radius: 6px; background: {{t.glass2}}; color: {{t.muted}}">gold: synthetic_v1</span>
      <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; padding: 2px 6px; border-radius: 6px; background: {{t.glass2}}; color: {{t.muted}}">127.0.0.1</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 2px 4px">
    <div aria-hidden="true" style="width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{t.accent}}; color: {{t.onAccent}}; font-weight: 600; font-size: 13px">H</div>
    <div style="min-width: 0">
      <div style="font-weight: 500">Huzaifa</div>
      <div style="font-size: 11.5px; color: {{t.faint}}">Ithaca, NY · ET</div>
    </div>
    <button type="button" aria-label="Settings" style="margin-left: auto; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 9px; border: 0; background: transparent; color: {{t.muted}}; cursor: pointer">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"></path></svg>
    </button>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"active":{"editor":"enum","options":["chat","annotate","review"],"default":"chat"},"session":{"editor":"text","default":"rhr"},"minH":{"editor":null,"default":"876px"},"$preview":{"width":264,"height":900}}'>
class Component extends DCLogic {
  tokens(n) {
    const L = { glass: 'rgba(255,255,255,0.56)', glass2: 'rgba(255,255,255,0.80)', hair: 'rgba(15,23,42,0.09)', text: '#0E1420', muted: '#465163', faint: '#5A6576', accent: '#2C64DB', accentSoft: 'rgba(44,100,219,0.10)', onAccent: '#FFFFFF', chip: 'rgba(15,23,42,0.05)', sel: 'rgba(15,23,42,0.07)', input: 'rgba(255,255,255,0.72)', ok: '#13784A', shadow: 'inset 0 1px 0 rgba(255,255,255,0.7), 0 10px 30px rgba(15,23,42,0.07)' };
    const D = { glass: 'rgba(19,24,32,0.58)', glass2: 'rgba(30,36,47,0.70)', hair: 'rgba(255,255,255,0.08)', text: '#E7EBF1', muted: '#A6B0BE', faint: '#8E98A7', accent: '#7AA7FF', accentSoft: 'rgba(122,167,255,0.14)', onAccent: '#08101F', chip: 'rgba(255,255,255,0.06)', sel: 'rgba(255,255,255,0.09)', input: 'rgba(255,255,255,0.04)', ok: '#5BD69A', shadow: 'inset 0 1px 0 rgba(255,255,255,0.05), 0 12px 40px rgba(0,0,0,0.40)' };
    return n === 'dark' ? D : L;
  }
  renderVals() {
    const theme = this.props.theme ?? 'light';
    const t = this.tokens(theme);
    const active = this.props.active ?? 'chat';
    const session = this.props.session ?? 'rhr';
    const icons = { chat: 'M4 5h16v11H9l-5 4z', annotate: 'M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4', review: 'M4 5h7v14H4zM13 5h7v14h-7z' };
    const nav = [
      { id: 'chat', label: 'Chat', href: 'Main.dc.html', count: '' },
      { id: 'annotate', label: 'Annotate', href: 'Annotate.dc.html', count: '37/100' },
      { id: 'review', label: 'Review', href: 'Review.dc.html', count: '14' }
    ].map((n) => ({ ...n, icon: icons[n.id], current: n.id === active ? 'page' : 'false', bg: n.id === active ? t.accentSoft : 'transparent', fg: n.id === active ? t.text : t.muted, ic: n.id === active ? t.accent : t.faint }));
    const groups = [
      { label: 'Today', items: [{ id: 'rhr', title: 'Resting HR since lifting' }, { id: 'steps', title: 'Steps this week' }] },
      { label: 'Yesterday', items: [{ id: 'deep', title: 'Deep sleep vs resting HR' }, { id: 'odd', title: 'Any odd HR days in November?' }] },
      { label: 'Previous 7 days', items: [{ id: 'azm', title: 'Active minutes by week' }, { id: 'sleepcmp', title: 'Sleep: October vs September' }, { id: 'winter', title: 'How did last winter go?' }] },
      { label: 'October', items: [{ id: 'metrics', title: 'What metrics do I have?' }, { id: 'deload', title: 'Recovery during deload week' }] }
    ].map((g) => ({ ...g, items: g.items.map((i) => ({ ...i, bg: i.id === session ? t.sel : 'transparent', fg: i.id === session ? t.text : t.muted, weight: i.id === session ? 500 : 400 })) }));
    return { t, nav, groups, minH: this.props.minH ?? '876px' };
  }
}
</script>
</body>
</html>
