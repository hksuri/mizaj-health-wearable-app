<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mizaj — new chat</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 100%; min-height: 960px; box-sizing: border-box; overflow: hidden; background: {{t.bg}}; color: {{t.text}}; font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 14px; line-height: 1.55">
  <svg aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%">
    <defs>
      <pattern id="girih-empty" width="96" height="96" patternUnits="userSpaceOnUse">
        <g style="fill: none; stroke: {{t.pat}}; stroke-width: 1">
          <rect x="28" y="28" width="40" height="40"></rect>
          <rect x="28" y="28" width="40" height="40" transform="rotate(45 48 48)"></rect>
          <path d="M0 0L28 28M96 0L68 28M0 96L28 68M96 96L68 68M48 0V19.7M48 96V76.3M0 48H19.7M96 48H76.3"></path>
        </g>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#girih-empty)"></rect>
  </svg>
  <div aria-hidden="true" style="position: absolute; left: 30%; top: -260px; width: 720px; height: 620px; border-radius: 50%; background: {{t.blobA}}; filter: blur(110px)"></div>
  <div aria-hidden="true" style="position: absolute; right: -200px; bottom: -240px; width: 600px; height: 600px; border-radius: 50%; background: {{t.blobB}}; filter: blur(110px)"></div>

  <div style="position: relative; display: flex; flex-wrap: wrap; align-items: stretch; gap: 12px; padding: 12px; min-height: 960px; box-sizing: border-box">
    <div style="flex: 1 1 248px; max-width: 272px; min-width: 232px; display: flex">
      <dc-import name="Sidebar" theme="{{theme}}" active="chat" session="none" min-h="936px" hint-size="100%,936px"></dc-import>
    </div>

    <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; border-radius: 18px; background: {{t.glass}}; backdrop-filter: blur(24px) saturate(140%); border: 1px solid {{t.hair}}; box-shadow: {{t.shadow}}; overflow: hidden">
      <header style="display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 22px; border-bottom: 1px solid {{t.hair}}">
        <h1 style="margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em">New chat</h1>
        <div style="margin-left: auto; display: flex; align-items: center; gap: 8px">
          <div role="group" aria-label="Theme" style="display: flex; padding: 3px; gap: 2px; border-radius: 11px; background: {{t.chip}}; border: 1px solid {{t.hair}}">
            <button type="button" aria-label="Light mode" aria-pressed="{{isLight}}" onClick="{{setLight}}" style="width: 34px; height: 30px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: {{lightBg}}; color: {{lightFg}}; cursor: pointer">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"></path></svg>
            </button>
            <button type="button" aria-label="Dark mode" aria-pressed="{{isDark}}" onClick="{{setDark}}" style="width: 34px; height: 30px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: {{darkBg}}; color: {{darkFg}}; cursor: pointer">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linejoin: round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>
            </button>
          </div>
          <a href="Main.dc.html" aria-label="Open insights panel" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 10px; border: 1px solid {{t.hair}}; color: {{t.text}}">
            <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linejoin: round"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M15 4v16"></path></svg>
          </a>
        </div>
      </header>

      <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 40px 24px 28px">
        <div style="width: 100%; max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px">
          <div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px">
            <div style="width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: {{t.glass2}}; border: 1px solid {{t.hair}}; box-shadow: {{t.shadow}}; color: {{t.accent}}">
              <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linejoin: round"><rect x="6.5" y="6.5" width="11" height="11"></rect><rect x="6.5" y="6.5" width="11" height="11" transform="rotate(45 12 12)"></rect><circle cx="12" cy="12" r="2.2"></circle></svg>
            </div>
            <h2 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.025em">Mizaj kaisa hai, Huzaifa?</h2>
            <div style="font-size: 13.5px; color: {{t.muted}}">Tuesday, November 24 · Ithaca, NY · week 12 of training</div>
          </div>

          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px">
            <sc-for list="{{tiles}}" as="tile" hint-placeholder-count="4">
              <div style="padding: 12px 14px; border-radius: 14px; background: {{t.glass2}}; border: 1px solid {{t.hair}}; box-shadow: {{t.shadow}}; display: flex; flex-direction: column; gap: 2px">
                <div style="display: flex; align-items: center; font-size: 12px; color: {{t.muted}}">{{tile.label}}<span style="margin-left: auto; font-weight: 500; color: {{tile.dc}}">{{tile.delta}}</span></div>
                <div style="display: flex; align-items: baseline; gap: 4px"><span style="font-size: 22px; font-weight: 600; letter-spacing: -0.02em">{{tile.value}}</span><span style="font-size: 12px; color: {{t.faint}}">{{tile.unit}}</span></div>
                <svg aria-hidden="true" viewBox="0 0 120 32" preserveAspectRatio="none" style="width: 100%; height: 28px; margin-top: 4px; overflow: visible"><polyline points="{{tile.pts}}" style="fill: none; stroke: {{t.accent}}; stroke-width: 1.5; stroke-linejoin: round; vector-effect: non-scaling-stroke"></polyline></svg>
              </div>
            </sc-for>
          </div>

          <div style="display: flex; flex-direction: column; gap: 10px">
            <div style="font-size: 12px; font-weight: 500; color: {{t.faint}}">Try asking</div>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px">
              <sc-for list="{{prompts}}" as="p" hint-placeholder-count="6">
                <a href="Main.dc.html" style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 14px; background: {{t.glass2}}; border: 1px solid {{t.hair}}; color: {{t.text}}; text-decoration: none">
                  <span style="align-self: flex-start; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; padding: 1px 6px; border-radius: 6px; background: {{t.accentSoft}}; color: {{t.accent}}">{{p.tag}}</span>
                  <span style="font-size: 13.5px; line-height: 1.45">{{p.text}}</span>
                </a>
              </sc-for>
            </div>
          </div>

          <form style="position: relative; border-radius: 16px; background: {{t.glass2}}; border: 1px solid {{t.hair}}; box-shadow: {{t.shadow}}; padding: 14px 12px 10px 16px; display: flex; flex-direction: column; gap: 10px">
            <label for="ask-empty" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Ask about your health data</label>
            <textarea id="ask-empty" rows="2" placeholder="Ask about steps, sleep, resting HR, active minutes…" style="resize: none; border: 0; outline: none; background: transparent; color: {{t.text}}; font: inherit; font-size: 15px"></textarea>
            <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
              <button type="button" style="display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 9px; border: 1px solid {{t.hair}}; background: {{t.chip}}; color: {{t.muted}}; font: inherit; font-size: 12.5px; cursor: pointer">
                <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>
                Last 90 days
              </button>
              <button type="button" style="display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 9px; border: 1px solid {{t.hair}}; background: {{t.chip}}; color: {{t.muted}}; font: inherit; font-size: 12.5px; cursor: pointer">
                <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round"><path d="M3 12h4l2-5 4 10 2-5h6"></path></svg>
                All metrics
              </button>
              <span style="margin-left: auto; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11.5px; color: {{t.faint}}">haiku-5.5 · ≤4 tools</span>
              <button type="submit" aria-label="Send" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 10px; border: 0; background: {{t.accent}}; color: {{t.onAccent}}; cursor: pointer">
                <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M12 19V5M6 11l6-6 6 6"></path></svg>
              </button>
            </div>
          </form>
          <p style="margin: -16px 0 0; text-align: center; font-size: 11.5px; color: {{t.faint}}">Trends and patterns only — not medical advice. 18 months of data · last sync 6:12 AM.</p>
        </div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  tokens(n) {
    const L = { bg: '#E8ECF1', pat: 'rgba(71,85,105,0.13)', blobA: 'rgba(110,145,215,0.30)', blobB: 'rgba(120,190,205,0.22)', glass: 'rgba(255,255,255,0.56)', glass2: 'rgba(255,255,255,0.80)', hair: 'rgba(15,23,42,0.09)', text: '#0E1420', muted: '#465163', faint: '#5A6576', accent: '#2C64DB', accentSoft: 'rgba(44,100,219,0.10)', onAccent: '#FFFFFF', chip: 'rgba(15,23,42,0.05)', sel: 'rgba(15,23,42,0.07)', input: 'rgba(255,255,255,0.72)', grid: 'rgba(15,23,42,0.09)', series2: '#8391A5', ok: '#13784A', bad: '#B42330', warn: '#985A00', shadow: 'inset 0 1px 0 rgba(255,255,255,0.7), 0 10px 30px rgba(15,23,42,0.07)' };
    const D = { bg: '#090C11', pat: 'rgba(148,163,184,0.075)', blobA: 'rgba(64,105,200,0.24)', blobB: 'rgba(36,130,150,0.16)', glass: 'rgba(19,24,32,0.58)', glass2: 'rgba(30,36,47,0.70)', hair: 'rgba(255,255,255,0.08)', text: '#E7EBF1', muted: '#A6B0BE', faint: '#8E98A7', accent: '#7AA7FF', accentSoft: 'rgba(122,167,255,0.14)', onAccent: '#08101F', chip: 'rgba(255,255,255,0.06)', sel: 'rgba(255,255,255,0.09)', input: 'rgba(255,255,255,0.04)', grid: 'rgba(255,255,255,0.08)', series2: '#6B7789', ok: '#5BD69A', bad: '#FF8A8A', warn: '#F2B84B', shadow: 'inset 0 1px 0 rgba(255,255,255,0.05), 0 12px 40px rgba(0,0,0,0.40)' };
    return n === 'dark' ? D : L;
  }
  rng(seed) { let s = seed; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
  gen(seed, n, f) { const r = this.rng(seed); const a = []; for (let i = 0; i < n; i++) a.push(f(i, r())); return a; }
  spark(v) { const mn = Math.min(...v), mx = Math.max(...v); return v.map((x, i) => (i / (v.length - 1) * 120).toFixed(1) + ',' + (30 - (x - mn) / ((mx - mn) || 1) * 26).toFixed(1)).join(' '); }
  renderVals() {
    const s = this.state || {};
    const theme = s.theme || this.props.theme || 'light';
    const t = this.tokens(theme);
    const tiles = [
      { label: 'Resting HR', value: '57.6', unit: 'bpm', delta: '−1.1', dc: t.ok, pts: this.spark(this.gen(3, 28, (i, x) => 59.2 - i * 0.06 + (x - 0.5) * 1.6)) },
      { label: 'Sleep', value: '7h 14m', unit: '', delta: '+9m', dc: t.ok, pts: this.spark(this.gen(5, 28, (i, x) => 6.9 + i * 0.012 + (x - 0.5) * 0.8)) },
      { label: 'Steps', value: '6,120', unit: '/day', delta: '−18%', dc: t.warn, pts: this.spark(this.gen(7, 28, (i, x) => (i < 21 ? 8300 : 6100) + (x - 0.5) * 1800)) },
      { label: 'Active', value: '46', unit: 'min/day', delta: '+6', dc: t.ok, pts: this.spark(this.gen(9, 28, (i, x) => 36 + i * 0.35 + ((i % 7) < 5 ? 8 : -6) + (x - 0.5) * 6)) }
    ];
    const prompts = [
      { tag: 'trend', text: 'Is my resting heart rate trending down since I started lifting?' },
      { tag: 'compare', text: 'Did my sleep change after I started training 4–5× a week?' },
      { tag: 'seasonal', text: 'Have my steps dropped since the snow started in Ithaca?' },
      { tag: 'anomaly', text: 'Any unusual resting HR days this month I should look at?' },
      { tag: 'correlate', text: 'Do nights with more deep sleep line up with a lower resting HR?' },
      { tag: 'chart', text: 'Plot my active minutes by week since September.' }
    ];
    return {
      t, theme, tiles, prompts,
      isLight: theme === 'light' ? 'true' : 'false', isDark: theme === 'dark' ? 'true' : 'false',
      lightBg: theme === 'light' ? t.glass2 : 'transparent', lightFg: theme === 'light' ? t.text : t.faint,
      darkBg: theme === 'dark' ? t.glass2 : 'transparent', darkFg: theme === 'dark' ? t.text : t.faint,
      setLight: () => this.setState({ theme: 'light' }), setDark: () => this.setState({ theme: 'dark' })
    };
  }
}
</script>
</body>
</html>
